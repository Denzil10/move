[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "free-claude-code"
version = "2.0.0"
description = "Middleware between Claude Code CLI (Anthropic API) and NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [ "fastapi[standard]>=0.136.1", "uvicorn>=0.46.0", "httpx[socks]>=0.28.1", "markdown-it-py>=3.0.0", "pydantic>=2.13.3", "python-dotenv>=1.2.2", "tiktoken>=0.7.0", "python-telegram-bot>=22.7", "discord.py>=2.7.1", "pydantic-settings>=2.14.0", "openai>=2.32.0", "loguru>=0.7.0", "aiohttp>=3.13.4",]

[dependency-groups]
dev = [ "pytest>=9.0.3", "pytest-asyncio>=1.3.0", "pytest-cov>=7.1.0", "ty>=0.0.32", "ruff>=0.15.12", "pytest-xdist>=3.8.0",]

[project.scripts]
free-claude-code = "cli.entrypoints:serve"
fcc-init = "cli.entrypoints:init"

[project.optional-dependencies]
voice = [ "grpcio>=1.80.0", "grpcio-tools>=1.80.0", "nvidia-riva-client>=2.25.1",]
voice_local = [ "torch>=2.11.0", "transformers>=5.6.2", "accelerate>=1.13.0", "librosa>=0.10.0",]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF",]
ignore = [ "E501", "B008", "RUF006",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = [ ".",]
addopts = "-n auto"
testpaths = [ "tests",]
markers = [ "live: opt-in local smoke tests that can touch real services", "interactive: smoke tests requiring manual user interaction", "provider: live provider checks", "messaging: live messaging platform checks", "cli: CLI integration checks", "clients: client compatibility checks", "voice: voice transcription checks", "contract: deterministic feature contract checks", "smoke_target(name): route a smoke test behind FCC_SMOKE_TARGETS",]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
allowed-unresolved-imports = [ "torch", "transformers", "librosa", "riva.client", "xdk", "requests_oauthlib",]

[tool.uv.sources.torch]
index = "pytorch-cu130"

[tool.ruff.lint.isort]
known-first-party = [ "api", "cli", "config", "core", "messaging", "providers", "smoke",]

[tool.hatch.build.targets.wheel]
packages = [ "api", "cli", "config", "core", "messaging", "providers",]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "cli/env.example"
